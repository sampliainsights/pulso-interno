<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulso semanal · Samplia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8F9FC; --line:#DDE0E4; --line-2:#EDEEF2;
  --ink:#171C25; --ink-2:#5A5E66; --ink-3:#878B92;
  --accent:#2C4B8E; --accent-soft:#E6EFFF; --accent-ink:#FFFFFF; --accent-strong:#16316D;
  --pos:#227A5C; --pos-soft:#DEF5EA; --neg:#A3402F; --neg-soft:#FFE8E2;
  --r1:#EEF3FB; --r2:#D3E0FA; --r3:#A8C0ED; --r4:#6F8ECD; --r5:#2C4B8E;
  --sup-a:#EBEDF1; --sup-b:#DDE0E5;
  --marca:#C73346;
  --shadow:none;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0E1115; --surface:#17191E; --surface-2:#202328; --line:#32353C; --line-2:#272A30;
  --ink:#EBEDF1; --ink-2:#AEB1B8; --ink-3:#81858C;
  --accent:#799DE6; --accent-soft:#1C2945; --accent-ink:#0E1115; --accent-strong:#9EBEFC;
  --pos:#55B38F; --pos-soft:#103628; --neg:#E27965; --neg-soft:#45231C;
  --r1:#222A39; --r2:#303F5F; --r3:#445D8E; --r4:#5F7EBC; --r5:#7FA2E9;
  --sup-a:#1F2227; --sup-b:#2B2E34;
  --marca:#E97076;
  --shadow:none;
  --radius:10px;
}}
:root[data-theme="dark"]{
  --ground:#0E1115; --surface:#17191E; --surface-2:#202328; --line:#32353C; --line-2:#272A30;
  --ink:#EBEDF1; --ink-2:#AEB1B8; --ink-3:#81858C;
  --accent:#799DE6; --accent-soft:#1C2945; --accent-ink:#0E1115; --accent-strong:#9EBEFC;
  --pos:#55B38F; --pos-soft:#103628; --neg:#E27965; --neg-soft:#45231C;
  --r1:#222A39; --r2:#303F5F; --r3:#445D8E; --r4:#5F7EBC; --r5:#7FA2E9;
  --sup-a:#1F2227; --sup-b:#2B2E34;
  --marca:#E97076;
  --shadow:none;
  --radius:10px;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink); margin:0;
  font-family:"Raleway",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.mono{font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums}
.wrap{max-width:600px; margin:0 auto; padding-inline:20px; padding-block:40px 60px}
.eyebrow{font-weight:600; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3)}
.eyebrow.marca{color:var(--marca)}

.topbar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:10px}
.topbar h1{font-size:17px; margin:0; font-weight:600; letter-spacing:-.01em}
.topbar .meta{font-size:12px; color:var(--ink-3)}

.demo{
  font-size:12px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:22px;
}

.progress{height:3px; background:var(--line-2); border-radius:2px; overflow:hidden; margin-bottom:26px}
.progress span{display:block; height:100%; background:var(--accent); border-radius:2px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 26px 22px}
.step-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px}
.q{font-size:20px; line-height:1.35; font-weight:500; letter-spacing:-.01em; text-wrap:balance; margin:0 0 22px}

fieldset{border:0; margin:0; padding:0}
legend{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.scale{display:flex; gap:8px}
.scale.wide{flex-wrap:wrap; gap:6px}
.opt{flex:1; position:relative; min-width:0}
.opt input{position:absolute; opacity:0; width:1px; height:1px}
.opt label{
  display:flex; align-items:center; justify-content:center; height:56px; cursor:pointer;
  border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  font-family:inherit; font-size:17px; color:var(--ink-2);
  transition:background .12s, border-color .12s, color .12s, transform .12s;
}
.scale.wide .opt{flex:0 0 calc(9.09% - 6px); min-width:38px}
.scale.wide .opt label{height:48px; font-size:15px}
.opt label:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px)}
.opt input:checked + label{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.opt input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
.anchors{display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; color:var(--ink-3)}

/* preguntas de opciones: una lista vertical, no una escala */
.choices{display:flex; flex-direction:column; gap:8px}
.choice{position:relative}
.choice input{position:absolute; opacity:0; width:1px; height:1px}
.choice label{
  display:flex; align-items:center; gap:11px; min-height:50px; padding:11px 14px; cursor:pointer;
  border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  font-size:14.5px; color:var(--ink-2); line-height:1.4;
  transition:background .12s, border-color .12s, color .12s;
}
.choice label .mark{
  flex:none; width:19px; height:19px; border:1.5px solid var(--line); background:var(--surface);
  display:grid; place-items:center; color:transparent;
}
.choice.single label .mark{border-radius:50%}
.choice.multi  label .mark{border-radius:5px}
.choice label:hover{border-color:var(--accent); color:var(--ink)}
.choice input:checked + label{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
.choice input:checked + label .mark{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.choice input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
.choice .key{margin-left:auto; font-family:inherit; font-size:11px; color:var(--ink-3)}
.hint{margin-top:10px; font-size:12.5px; color:var(--ink-3)}

textarea{
  width:100%; min-height:130px; resize:vertical; padding:13px 14px; font:inherit; font-size:14.5px;
  color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
}
textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}

.check{display:flex; gap:11px; align-items:flex-start; margin-top:20px; padding:13px 14px;
  border:1px solid var(--line); border-radius:9px; background:var(--surface-2); cursor:pointer}
.check input{margin-top:3px; accent-color:var(--accent); width:16px; height:16px; flex:none}
.check .t{font-size:13.5px}
.check .t b{font-weight:500}
.check .t span{display:block; color:var(--ink-3); font-size:12.5px; margin-top:3px}

.actions{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:22px}
button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid transparent}
.btn{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  padding:11px 22px; font-weight:500; font-size:14.5px}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-ghost{background:none; color:var(--ink-2); border-color:var(--line); padding:9px 16px; font-size:13.5px}
.btn-ghost:hover{border-color:var(--ink-3); color:var(--ink)}
.link{background:none; border:0; color:var(--ink-3); font-size:13px; text-decoration:underline;
  text-underline-offset:3px; padding:4px}
.link:hover{color:var(--accent)}

.privacy{margin-top:18px; font-size:12.5px; color:var(--ink-3); display:flex; gap:9px; align-items:flex-start}
.privacy svg{flex:none; margin-top:2px}

.done{text-align:center; padding:12px 8px 6px}
.done .tick{width:46px; height:46px; margin:0 auto 16px; border-radius:50%; background:var(--accent-soft);
  display:grid; place-items:center}
.done h2{font-size:21px; margin:0 0 10px; font-weight:600}
.done p{margin:0 auto 8px; max-width:44ch; color:var(--ink-2); font-size:14px}
.payload{margin-top:22px; text-align:left}
.payload summary{cursor:pointer; font-size:12.5px; color:var(--ink-3); padding:6px 0}
.payload summary:hover{color:var(--accent)}
.payload pre{
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:13px;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; font-size:11.5px; line-height:1.6; color:var(--ink-2);
  overflow-x:auto; margin:6px 0 0;
}
footer{margin-top:26px; font-size:12px; color:var(--ink-3); text-align:center}
footer code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; font-size:11.5px}
@media (max-width:460px){
  .scale{gap:6px} .opt label{height:52px; font-size:16px}
  .choice .key{display:none}
  .scale.wide .opt{flex:0 0 calc(16.6% - 6px)}
  .card{padding:22px 18px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow marca">Samplia</div>

  <footer>
    La pantalla lee el ciclo con <code>get_survey(token)</code> y envía con
    <code>submit_response(token, answers, comment, identify)</code>.
  </footer>
</div>

<script type="application/json" id="survey">{
 "status": "open",

 "questions": [

<script>
"use strict";

/* ==================================================================== *
 *  CAPA DE DATOS
 *  Con CONFIG.url relleno y un token en la URL (?t=...), la página pide el
 *  ciclo a Supabase con get_survey y lo envía con submit_response. Sin token
 *  —o si la llamada falla— funciona en modo demo con el ciclo embebido.
 * ==================================================================== */
const CONFIG = {
  url: "https://tlljvyxcqtrmiutqnjir.supabase.co",
  key: "sb_publishable_91UlPuAQdhvg9ylW1bME4g_CDhirXlA",
  threadUrl: "thread_live.html"      // dónde vive la pantalla del hilo
};
let threadToken = null;
const TOKEN = new URLSearchParams(location.search).get("t");
const CONFIGURED = CONFIG.url && !CONFIG.url.startsWith("__");

let SURVEY = JSON.parse(document.getElementById("survey").textContent);
let DEMO = true;

async function rpc(fn, args){
  const r = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json",
               apikey: CONFIG.key, Authorization: `Bearer ${CONFIG.key}` },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error((await r.text()).slice(0, 160));
  return r.json();
}

const stage = document.getElementById("stage");
const bar   = document.getElementById("bar");
const fmtDate = s => new Date(s+"T00:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"});

function paintHeader(){
  // una consulta puntual no es el pulso semanal: la cabecera lo dice
  const esConsulta = SURVEY.kind === "consulta";
  document.querySelector(".topbar h1").textContent = esConsulta ? "Una consulta rápida" : "Pulso semanal";
  document.title = esConsulta ? "Una consulta rápida · Samplia" : "Pulso semanal · Samplia";
  document.getElementById("meta").textContent = SURVEY.closes_on
    ? "Cierra el " + fmtDate(SURVEY.closes_on) : "";
  document.getElementById("demo-note").textContent = DEMO
    ? "Demo: las respuestas no se guardan en ninguna parte. Al terminar verás exactamente lo que se enviaría a la base de datos."
    : "Tus respuestas son anónimas: se guardan sin tu nombre y sin la hora exacta.";
}

function message(titulo, texto){
  bar.style.width = "100%";
  document.getElementById("demo-note").hidden = true;
  stage.innerHTML = `<div class="done"><h2>${titulo}</h2><p>${texto}</p></div>`;
}

const answers = {};            // question_id -> valor numérico (escalas y eNPS)
const choices = {};            // question_id -> [option_id, ...] (preguntas de opciones)
let comment = "", identify = false;
let steps = [];
let i = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setProgress(){
  bar.style.width = Math.round(i / steps.length * 100) + "%";
}

function tick(){
  return `<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
    aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>`;
}

/* Preguntas de opciones. Una sola respuesta avanza sola, como la escala;
   la de varias necesita un botón, porque no se sabe cuándo ha terminado. */
function choiceStep(q){
  const marcadas = choices[q.id] || [];
  const opts = q.options || [];
  return `
    <div class="step-head">
      <span class="eyebrow">${q.multi ? "Puedes marcar varias" : "Una respuesta"}</span>
      <span class="eyebrow mono">${i+1} / ${steps.length}</span>
    </div>
    <p class="q">${esc(q.body)}</p>
    <fieldset>
      <legend>${esc(q.body)}</legend>
      <div class="choices" id="choices">
        ${opts.map((o, n) => `<span class="choice ${q.multi ? "multi" : "single"}">
            <input type="${q.multi ? "checkbox" : "radio"}" name="o" id="o${n}" value="${o.id}"
                   data-exclusive="${o.exclusive ? "1" : ""}"
                   ${marcadas.includes(o.id) ? "checked" : ""}>
            <label for="o${n}">${tick()}
              <span>${esc(o.label)}</span>
              <span class="key">${n + 1}</span></label></span>`).join("")}
      </div>
    </fieldset>
    ${q.multi ? `<p class="hint">Marca todas las que te valgan y pulsa Siguiente.</p>` : ""}
    <div class="actions">
      <button class="btn-ghost" id="back" ${i === 0 ? "disabled" : ""}>Atrás</button>
      <button class="link" id="skip">Prefiero no contestar</button>
      ${q.multi ? `<button class="btn" id="siguiente">Siguiente</button>` : ""}
    </div>
    <div class="privacy">
      ${lock()} <span>Tu respuesta se guarda sin tu nombre y sin la hora exacta. Sólo se
      muestra agregada con las de al menos otras 4 personas.</span>
    </div>`;
}

function scaleStep(q){
  const isEnps = q.type === "enps_0_10";
  const vals = isEnps ? [...Array(11).keys()] : [1,2,3,4,5];
  const left  = isEnps ? "Nada probable" : "Nada de acuerdo";
  const right = isEnps ? "Muy probable"  : "Totalmente de acuerdo";
  return `
    <div class="step-head">
      <span class="eyebrow">${isEnps ? "Recomendación" : esc(q.dimension || "")}</span>
      <span class="eyebrow mono">${i+1} / ${steps.length}</span>
    </div>
    <p class="q">${esc(q.body)}</p>
    <fieldset>
      <legend>${esc(q.body)}</legend>
      <div class="scale ${isEnps ? "wide" : ""}" id="scale">
        ${vals.map(v => `<span class="opt">
            <input type="radio" name="v" id="v${v}" value="${v}"
                   ${answers[q.id] === v ? "checked" : ""}>
            <label for="v${v}">${v}</label></span>`).join("")}
      </div>
      <div class="anchors"><span>${left}</span><span>${right}</span></div>
    </fieldset>
    <div class="actions">
      <button class="btn-ghost" id="back" ${i === 0 ? "disabled" : ""}>Atrás</button>
      <button class="link" id="skip">Prefiero no contestar</button>
    </div>
    <div class="privacy">
      ${lock()} <span>Tu respuesta se guarda sin tu nombre y sin la hora exacta. Sólo se
      muestra agregada con las de al menos otras 4 personas.</span>
    </div>`;
}

function commentStep(){
  return `
    <div class="step-head">
      <span class="eyebrow">Último paso</span>
      <span class="eyebrow mono">${i+1} / ${steps.length}</span>
    </div>
    <p class="q">¿Hay algo que quieras contar?</p>
    <textarea id="comment" placeholder="Opcional. Lo lee el equipo de RRHH, sin saber quién lo escribió."
      maxlength="1200">${esc(comment)}</textarea>
    <label class="check">
      <input type="checkbox" id="identify" ${identify ? "checked" : ""}>
      <span class="t"><b>Quiero identificarme en esta respuesta</b>
        <span>Por defecto no se guarda quién eres. Si marcas esto, RRHH podrá
        responderte directamente — sólo en esta respuesta, no en las siguientes.</span></span>
    </label>
    <div class="actions">
      <button class="btn-ghost" id="back">Atrás</button>
      <button class="btn" id="send">Enviar</button>
    </div>`;
}

function lock(){
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/>
    <path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
}

const esChoice = q => q.type === "choice";

function render(){
  setProgress();
  const step = steps[i];
  stage.innerHTML = step.kind !== "q" ? commentStep()
                  : esChoice(step.q) ? choiceStep(step.q) : scaleStep(step.q);

  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { if (i > 0) { i--; render(); } });

  if (step.kind === "q" && esChoice(step.q)) {
    const q = step.q;
    document.getElementById("choices").addEventListener("change", ev => {
      if (!q.multi) {
        choices[q.id] = [ev.target.value];
        setTimeout(next, 170);
        return;
      }
      // "Nada, no creo que participe" no se combina con las demás
      const caja = ev.target;
      if (caja.checked && caja.dataset.exclusive) {
        stage.querySelectorAll("#choices input").forEach(x => { if (x !== caja) x.checked = false; });
      } else if (caja.checked) {
        stage.querySelectorAll("#choices input[data-exclusive='1']").forEach(x => { x.checked = false; });
      }
      choices[q.id] = [...stage.querySelectorAll("#choices input:checked")].map(x => x.value);
      if (choices[q.id].length === 0) delete choices[q.id];
    });
    const seguir = document.getElementById("siguiente");
    if (seguir) seguir.addEventListener("click", next);
    document.getElementById("skip").addEventListener("click", () => {
      delete choices[q.id]; next();
    });
    const first = stage.querySelector("#choices input");
    if (first) first.focus({preventScroll:true});

  } else if (step.kind === "q") {
    document.getElementById("scale").addEventListener("change", ev => {
      answers[step.q.id] = Number(ev.target.value);
      setTimeout(next, 170);
    });
    document.getElementById("skip").addEventListener("click", () => {
      delete answers[step.q.id]; next();
    });
    const first = stage.querySelector("input[type=radio]");
    if (first) first.focus({preventScroll:true});
  } else {
    const ta = document.getElementById("comment");
    ta.addEventListener("input", () => { comment = ta.value; });
    document.getElementById("identify").addEventListener("change", ev => { identify = ev.target.checked; });
    document.getElementById("send").addEventListener("click", send);
  }
}

function next(){ if (i < steps.length - 1) { i++; render(); } else { send(); } }

/* atajos de teclado: 1-5 (o 0-10 en el eNPS) */
document.addEventListener("keydown", ev => {
  const step = steps[i];
  if (!step || step.kind !== "q" || ev.metaKey || ev.ctrlKey) return;
  if (!/^[0-9]$/.test(ev.key)) return;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;

  if (esChoice(step.q)) {
    // en las de opciones, 1-9 marca la n-ésima
    const el = document.getElementById("o" + (Number(ev.key) - 1));
    if (!el) return;
    ev.preventDefault();
    el.checked = step.q.multi ? !el.checked : true;
    el.dispatchEvent(new Event("change", {bubbles: true}));
    return;
  }
  const el = document.getElementById("v" + ev.key);
  if (el) { el.checked = true; answers[step.q.id] = Number(ev.key); setTimeout(next, 170); }
});

function payload(){
  return {
    p_token: DEMO ? "<token del enlace>" : new URLSearchParams(location.search).get("t"),
    p_answers: [
      ...Object.entries(answers).map(([question_id, value]) => ({question_id, value})),
      ...Object.entries(choices).map(([question_id, options]) => ({question_id, options}))
    ],
    p_comment: comment || null,
    p_identify: identify
  };
}

async function send(){
  const p = payload();
  if (!DEMO) {
    try {
      const res = await rpc("submit_response", p);
      threadToken = res && res.thread_token ? res.thread_token : null;
    } catch (err) {
      stage.innerHTML = `<div class="done"><h2>No se ha podido enviar</h2>
        <p>${err.message}</p>
        <div class="actions" style="justify-content:center">
          <button class="btn" onclick="location.reload()">Reintentar</button></div></div>`;
      return;
    }
  }
  if (DEMO && comment) threadToken = "ejemplo-de-token";
  bar.style.width = "100%";
  const answered = p.p_answers.length, total = SURVEY.questions.length;
  const threadLink = threadToken
    ? new URL(CONFIG.threadUrl + "?c=" + threadToken, location.href).href : null;
  stage.innerHTML = `
    <div class="done">
      <div class="tick">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>Gracias</h2>
      <p>Has contestado ${answered} de ${total} preguntas${comment ? " y dejado un comentario" : ""}.</p>
      <p>${identify
          ? "Como te has identificado, RRHH puede responderte directamente sobre esta respuesta."
          : "Se ha guardado sin tu nombre, con la fecha pero no la hora, y con tu equipo, localización y tramo de antigüedad para poder agrupar."}</p>
      <p>El enlace ya no vuelve a funcionar. El próximo pulso llega la semana que viene.</p>
      ${threadLink ? `
      <div style="margin:20px auto 4px;max-width:460px;text-align:left;padding:14px 16px;
                  border:1px solid var(--line);border-radius:10px;background:var(--surface-2)">
        <div style="font-size:13px;font-weight:500;margin-bottom:6px">Guarda este enlace</div>
        <div style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px">
          Es la única forma de ver si RRHH responde a tu comentario. Como no sabemos
          quién eres, no podemos avisarte de otra manera.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="thread-link" readonly value="${threadLink}"
            style="flex:1;min-width:200px;font:inherit;font-size:12px;padding:8px 10px;
                   border:1px solid var(--line);border-radius:8px;background:var(--surface);
                   color:var(--ink-2);font-family:inherit">
          <button class="btn-ghost" id="copy-link">Copiar</button>
        </div>
      </div>` : ""}
      ${DEMO ? `<details class="payload"><summary>Ver lo que se enviaría a la base de datos</summary>
        <pre>select app.submit_response(
  p_token   =&gt; '…',
  p_answers =&gt; '${esc(JSON.stringify(p.p_answers, null, 0))}'::jsonb,
  p_comment =&gt; ${p.p_comment ? "'" + esc(p.p_comment.replace(/'/g, "''")) + "'" : "null"},
  p_identify =&gt; ${p.p_identify}
);</pre></details>
      <div class="actions" style="justify-content:center">
        <button class="btn-ghost" id="again">Volver a empezar la demo</button>
      </div>` : ""}
    </div>`;
  const copy = document.getElementById("copy-link");
  if (copy) copy.addEventListener("click", async () => {
    const input = document.getElementById("thread-link");
    try { await navigator.clipboard.writeText(input.value); copy.textContent = "Copiado"; }
    catch { input.select(); copy.textContent = "Selecciona y copia"; }
  });
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", () => {
    i = 0; comment = ""; identify = false;
    Object.keys(answers).forEach(k => delete answers[k]);
    Object.keys(choices).forEach(k => delete choices[k]);
    render();
  });
}

(async function start(){
  if (CONFIGURED && TOKEN) {
    try {
      const data = await rpc("get_survey", { p_token: TOKEN });
      if (data.status === "open") {
        SURVEY = data; DEMO = false;
      } else {
        paintHeader();
        const textos = {
          invalid:  ["Este enlace no vale", "Puede que sea de un ciclo anterior o que ya se haya usado. Si crees que es un error, escribe a RRHH."],
          answered: ["Ya has respondido", "Gracias, no hace falta nada más."],
          closed:   ["Este ciclo ya está cerrado", "Se cerró el " + (data.closes_on ? fmtDate(data.closes_on) : "") + ". El siguiente llega pronto."]
        };
        const [t, x] = textos[data.status] || ["No se ha podido abrir la encuesta", ""];
        return message(t, x);
      }
    } catch (err) {
      console.warn("Sin conexión con Supabase, modo demo:", err.message);
    }
  }
  steps = [...SURVEY.questions.map(q => ({kind:"q", q})), {kind:"comment"}];
  paintHeader();
  render();
})();
</script>
